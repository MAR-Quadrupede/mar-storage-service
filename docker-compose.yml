version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: mar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mar_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-mar_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: mar-redis
    restart: unless-stopped
    command: ["redis-server", "/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro

  s3:
    image: alpine/minio:latest-release
    container_name: mar-s3
    restart: unless-stopped
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mar_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mar_minio_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data

volumes:
  postgres-data:
  redis-data:
  s3-data:
