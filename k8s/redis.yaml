apiVersion: apps/v1
kind: Deployment
metadata:
  name: mar-redis
  namespace: mar-system
  labels:
    app: mar-redis
    service: storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mar-redis
  template:
    metadata:
      labels:
        app: mar-redis
        service: storage
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - /etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 192Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: config-volume
              mountPath: /etc/redis/redis.conf
              subPath: redis.conf
      volumes:
        - name: redis-data
          hostPath:
            path: /var/lib/mar-data/redis
            type: DirectoryOrCreate
        - name: config-volume
          configMap:
            name: mar-storage-config
---
apiVersion: v1
kind: Service
metadata:
  name: mar-redis
  namespace: mar-system
  labels:
    app: mar-redis
spec:
  type: ClusterIP
  selector:
    app: mar-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
