apiVersion: apps/v1
kind: Deployment
metadata:
  name: mar-s3
  namespace: mar-system
  labels:
    app: mar-s3
    service: storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mar-s3
  template:
    metadata:
      labels:
        app: mar-s3
        service: storage
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: minio
          image: alpine/minio:latest-release
          imagePullPolicy: IfNotPresent
          command:
            - minio
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: mar-storage-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mar-storage-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BROWSER_REDIRECT_URL
              value: "https://mar-s3.gianlucamorello.it"
          ports:
            - name: s3-api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          hostPath:
            path: /var/lib/mar-data/minio
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: mar-s3
  namespace: mar-system
  labels:
    app: mar-s3
spec:
  type: NodePort
  selector:
    app: mar-s3
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
      nodePort: 30902
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
---
apiVersion: v1
kind: Service
metadata:
  name: mar-minio
  namespace: mar-system
  labels:
    app: mar-s3
spec:
  type: ClusterIP
  selector:
    app: mar-s3
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
