# Redis configuration for M.A.R. Quadruped on-edge broker & cache
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management (Optimized for Raspberry Pi 5 8GB)
maxmemory 128mb
maxmemory-policy allkeys-lru

# Persistence (AOF & RDB snapshotting)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 16mb

save 900 1
save 300 10
save 60 100
dbfilename dump.rdb
dir /data

# Logging
loglevel notice
